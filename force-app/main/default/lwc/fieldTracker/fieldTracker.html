<template>
    <lightning-card title="Field Tracking" icon-name="utility:location">
      <div class="slds-p-around_medium">

        <template if:true={isLoading}>
          <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
        </template>

        <template if:false={isLoading}>

          <!-- Not tracking → show Start button -->
          <template if:false={isTracking}>
            <div class="slds-text-align_center">
              <p class="slds-m-bottom_small slds-text-body_regular">
                Start tracking your location for the day.
              </p>
              <lightning-button
                label="Start My Day"
                variant="brand"
                icon-name="utility:play"
                onclick={handleStart}>
              </lightning-button>
            </div>
          </template>

          <!-- Currently tracking → show status + Stop button -->
          <template if:true={isTracking}>
            <div class="slds-box slds-theme_shade slds-m-bottom_small">
              <div class="slds-grid slds-gutters">
                <div class="slds-col">
                  <p class="slds-text-title_caps">Status</p>
                  <p class="slds-text-color_success slds-text-heading_small">
                    <lightning-icon icon-name="utility:record" size="xx-small" variant="success"></lightning-icon>
                    &nbsp;Tracking Active
                  </p>
                </div>
                <div class="slds-col">
                  <p class="slds-text-title_caps">Started</p>
                  <p>{startTimeFormatted}</p>
                </div>
              </div>
              <div class="slds-grid slds-gutters slds-m-top_small">
                <div class="slds-col">
                  <p class="slds-text-title_caps">Elapsed</p>
                  <p>{elapsedTime}</p>
                </div>
                <div class="slds-col">
                  <p class="slds-text-title_caps">Points Logged</p>
                  <p>{locationCount}</p>
                </div>
              </div>
            </div>

            <div class="slds-text-align_center">
              <lightning-button
                label="End My Day"
                variant="destructive"
                icon-name="utility:stop"
                onclick={handleStop}>
              </lightning-button>
            </div>
          </template>

        </template>
      </div>
    </lightning-card>
  </template>
